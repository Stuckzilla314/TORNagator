name: Sync Overseas Stock

on:
  workflow_dispatch: # Allows manual triggering
  repository_dispatch:
    types: [trigger-sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-firebase-admin-${{ hashFiles('package-lock.json') }}

      - name: Install Firebase Admin
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm install firebase-admin --prefer-offline --no-audit --no-fund

      - name: Run sync script
        run: node scripts/sync-stock.mjs
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
